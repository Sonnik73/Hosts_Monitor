name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  agent-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Agent selftest
        run: python3 agent/agent.py --selftest --config agent/config.example.json

      - name: Check assets copy of agent is in sync
        run: diff agent/agent.py app/src/main/assets/agent.py

  build:
    runs-on: ubuntu-latest
    needs: agent-selftest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Releases are used instead of artifacts: release assets don't count
      # toward the Actions storage quota on private repos.
      - name: Publish APK to Release (versioned name)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "hosts-monitor-v${VERSION}.apk"
          gh release create apk --title "APK builds" --notes "Свежая debug-сборка (обновляется при каждом пуше в main). Версия приложения: v${VERSION}" 2>/dev/null || true
          for a in $(gh release view apk --json assets --jq '.assets[].name' 2>/dev/null); do
            gh release delete-asset apk "$a" -y
          done
          gh release upload apk "hosts-monitor-v${VERSION}.apk" --clobber
