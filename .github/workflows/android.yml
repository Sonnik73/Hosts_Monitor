name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  agent-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Agent selftest
        run: python3 agent/agent.py --selftest --config agent/config.example.json

      - name: Check assets copy of agent is in sync
        run: diff agent/agent.py app/src/main/assets/agent.py

  build:
    runs-on: ubuntu-latest
    needs: agent-selftest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Releases are used instead of artifacts: release assets don't count
      # toward the Actions storage quota on private repos.
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: APK builds
          body: "Свежая debug-сборка приложения (обновляется при каждом пуше в main)"
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
